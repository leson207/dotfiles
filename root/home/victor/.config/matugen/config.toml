[config]
version_check = true

reload_apps = true

# 🔥 Make colors punchy instead of pastel
scheme = "vibrant"

# 👁 Increase overall contrast (text, borders, selections)
contrast = "high"

# 🎨 Saturation boosts (safe but noticeable)
[overrides.primary]
saturation = 3

[overrides.secondary]
saturation = 2

[overrides.tertiary]
saturation = 1.4

# [templates.m3colors]
# input_path = '~/.config/matugen/templates/quickkshell/colors.json'
# output_path = '~/.local/state/quickshell/user/generated/colors.json'
