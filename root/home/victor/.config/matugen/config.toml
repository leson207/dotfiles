# input_path = '~/.config/matugen/templates/quickshell/kde-color.txt'
# output_path = '~/.local/state/quickshell/user/generated/color.txt'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-3.0/color.css'
output_path = '~/.config//gtk-3.0/gtk.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-4.0/color.css'
output_path = '~/.config/gtk-4.0/gtk.css'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hypr/hyprland/color.conf'
output_path = '~/.config/hypr/hyprland/color.conf'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hypr/hyprlock/color.conf'
output_path = '~/.config/hypr/hyprlock/color.conf'

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty/color.conf"
output_path = "~/.config/kitty/color.conf"

[templates.rofi]
input_path = "~/.config/matugen/templates/rofi/color.rasi"
output_path = "~/.config/rofi/color.rasi"

[templates.rofi_wallpaper]
input_path = "~/.config/matugen/templates/rofi/color-wall.rasi"
output_path = "~/.config/rofi/color-wall.rasi"

[templates.swaync]
input_path = '~/.config/matugen/templates/swaync/style.css'
output_path = '~/.config/swaync/style.css'
post_hook = 'swaync-client -rs'

[templates.fuzzel]
input_path = '~/.config/matugen/templates/fuzzel/theme.ini'
output_path = '~/.config/fuzzel/theme.ini'

[templates.btop]
input_path = '~/.config/matugen/templates/btop/matugen.theme'
output_path = '~/.config/btop/themes/matugen.theme'
post_hook = "sh -c 'pkill -USR2 btop || true'"

[templates.pywalfox]
input_path = '~/.config/matugen/templates/pywalfox/color.json'
output_path = '~/.cache/wal/colors.json'
post_hook = 'pywalfox update'

