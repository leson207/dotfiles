theme = "catppuccin_mocha"

[editor]
line-number = "relative"
cursorline = true
color-modes = true
true-color=true
bufferline = "multiple"

indent-heuristic = "simple"
insert-final-newline = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true

[keys.normal]
C-s = ":write"

[keys.insert]
C-s = [":write", "normal_mode"]
j = { k = "normal_mode" }
