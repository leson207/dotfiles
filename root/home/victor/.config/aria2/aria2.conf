# -------------------------
# BASIC
# -------------------------
dir=~/Downloads
continue=true
file-allocation=trunc

# -------------------------
# CONNECTION
# -------------------------
max-connection-per-server=16
split=16
min-split-size=1M
max-concurrent-downloads=4

# -------------------------
# NETWORK
# -------------------------
enable-http-pipelining=true
reuse-uri=true
max-tries=5
retry-wait=5
timeout=60

# -------------------------
# DISK CACHE
# -------------------------
disk-cache=64M
enable-mmap=true

# -------------------------
# RPC (for browser tools / UI)
# -------------------------
enable-rpc=true
rpc-listen-all=true
rpc-allow-origin-all=true
rpc-secret=123456
rpc-listen-port=6800

# -------------------------
# TORRENT
# -------------------------
enable-dht=true
enable-peer-exchange=true
bt-max-peers=80
seed-time=0

# -------------------------
# LOG
# -------------------------
summary-interval=60
